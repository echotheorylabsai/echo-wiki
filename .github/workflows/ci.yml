name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Hook tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hooks use `#!/usr/bin/env bash`; put macOS's stock Bash 3.2 first on PATH.
      - name: Use macOS system Bash 3.2
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          bash --version
          ruby --version

      - name: Run hook test suite
        run: bash tests/run-tests.sh

  validate:
    name: Validate wiki skeleton
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate wiki and raw content
        run: ./hooks/validate.sh --all

      # The exit status alone cannot catch empty or garbled output; parse it.
      - name: Check --json output is valid JSON
        run: |
          ./hooks/validate.sh --all --json > "$RUNNER_TEMP/validate.json"
          ruby -rjson -e '
            out = JSON.parse(File.read(ARGV[0]))
            ok = out.is_a?(Hash) && out["files_validated"].is_a?(Integer) && out["violations"].is_a?(Array)
            abort "validate.sh --json: unexpected shape: #{out.inspect}" unless ok
            puts "OK: --json output parsed (#{out["files_validated"]} files)"
          ' "$RUNNER_TEMP/validate.json"

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run docs:build
