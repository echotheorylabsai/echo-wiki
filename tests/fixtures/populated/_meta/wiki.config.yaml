# Fixture config — default entity types plus one custom type (decision)
wiki:
  name: "Fixture Wiki"
  description: "Populated fixture for hook tests"

domains:
  - name: "ai"
    label: "Artificial Intelligence"
  - name: "general"
    label: "General"

entity_types:
  - name: concept
    dir: concepts
    label: Concepts
    description: "Ideas, theories, patterns, methodologies, principles"
  - name: person
    dir: people
    label: People
    description: "Researchers, authors, founders, key figures"
  - name: tool
    dir: tools
    label: Tools
    description: "Software, platforms, frameworks, products, services"
  - name: source-summary
    dir: sources
    label: Sources
    description: "Summaries of ingested raw sources"
  - name: decision
    dir: decisions
    label: Decisions
    description: "Recorded decisions with rationale"

source_types:
  - blog
  - paper
  - tweet
  - substack
  - github
  - podcast
  - video

ingestion:
  tavily:
    enabled: true
  firecrawl:
    enabled: false

defaults:
  decay_rate: medium
  confidence: medium

vault:
  dir: wiki
  default_workspace: my-notes

schema_version: 1
